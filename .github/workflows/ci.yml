name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Pinned like every other third-party binary this repo executes (see 40-firewall).
  SHFMT_VERSION: v3.10.0
  SHFMT_SHA256: 1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install shfmt (pinned + verified)
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: make lint
        run: make lint

      - name: Writing style (docs/STYLE.md)
        run: |
          mapfile -t files < <(git ls-files '*.md' '*.sh' '*.yaml' '*.yml' Makefile)
          scripts/lint-language.sh "${files[@]}"

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: bats tests/
        run: bats tests/

  dry-run:
    # A DRY_RUN pass over every module: proves each one is at least reachable end to end
    # on a stock image, and it is fast enough to fail the PR before the real runs start.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: make harden DRY_RUN=1
        run: sudo make harden DRY_RUN=1 FORCE_LOCKOUT_OK=1 ADMIN_USER=ciadmin

  harden:
    # The real thing, on both architectures: apply the baseline, prove the second run
    # changes nothing, then let `make audit` grade it. This is what covers arm64 —
    # GitHub's arm64 runners are real aarch64 hardware, where Hetzner's ARM capacity has
    # been unavailable. It is not a replacement for tier 3: a CI runner cannot be
    # rebooted or SSH'd into from outside, so the lockout drill stays on a real VM.
    needs: [dry-run]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Install sshd and the audit tools
        # sshd has to be running for the SSH module and ssh-audit to mean anything.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server lynis ssh-audit
          sudo systemctl enable --now ssh

      - name: harden (run 1)
        run: sudo make harden ADMIN_USER=ciadmin FORCE_LOCKOUT_OK=1

      - name: idempotence — a second run must report no changes
        run: |
          sudo make harden ADMIN_USER=ciadmin FORCE_LOCKOUT_OK=1 | tee /tmp/run2.log
          if grep -q '^CHANGED:' /tmp/run2.log; then
            echo "::error::second run reported changes"
            grep '^CHANGED:' /tmp/run2.log
            exit 1
          fi

      - name: audit must pass
        run: sudo make audit ADMIN_USER=ciadmin

      - name: audit must fail when a mandatory control is broken
        run: |
          sudo ufw disable
          if sudo make audit ADMIN_USER=ciadmin; then
            echo "::error::make audit passed with ufw disabled"
            exit 1
          fi
          sudo ufw --force enable

  kiosk-profile:
    # The Raspberry Pi kiosk variable set (examples/raspberry-pi-kiosk.env) applied for
    # real. The runner is a real arm64 machine running Ubuntu 24.04, NOT Raspberry Pi OS:
    # it has no Raspberry Pi archive and no Pi kernel, so this proves the profile's
    # variables work on arm64 Debian-family hosts and nothing about a Pi
    # (docs/RASPBERRY-PI.md). The two address knobs are pointed at loopback so the job
    # cannot cut itself off; the example's placeholder addresses are not used.
    needs: [dry-run]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install sshd and the audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server lynis ssh-audit
          sudo systemctl enable --now ssh

      - name: harden with the kiosk profile (run 1)
        run: |
          set -a; . examples/raspberry-pi-kiosk.env; set +a
          export ADMIN_USER=ciadmin FORCE_LOCKOUT_OK=1 SSH_ALLOW_FROM=127.0.0.1 FAIL2BAN_IGNOREIP=127.0.0.1
          sudo -E make harden

      - name: idempotence — a second run must report no changes
        run: |
          set -a; . examples/raspberry-pi-kiosk.env; set +a
          export ADMIN_USER=ciadmin FORCE_LOCKOUT_OK=1 SSH_ALLOW_FROM=127.0.0.1 FAIL2BAN_IGNOREIP=127.0.0.1
          sudo -E make harden | tee /tmp/run2.log
          if grep -q '^CHANGED:' /tmp/run2.log; then
            echo "::error::second run reported changes"
            grep '^CHANGED:' /tmp/run2.log
            exit 1
          fi

      - name: audit passes and reports the skipped module
        run: |
          set -a; . examples/raspberry-pi-kiosk.env; set +a
          export ADMIN_USER=ciadmin SSH_ALLOW_FROM=127.0.0.1 FAIL2BAN_IGNOREIP=127.0.0.1
          sudo -E make audit | tee /tmp/audit.log
          grep -q '^  \[skip\] docker installed (module docker skipped' /tmp/audit.log
          grep -q '^  \[ ok \] journald volatile, capped at 32M' /tmp/audit.log

      - name: the profile's files are what the docs say
        run: |
          set -x
          grep -q '^Storage=volatile' /etc/systemd/journald.conf.d/50-vmt-volatile.conf
          grep -q 'Package-Blacklist' /etc/apt/apt.conf.d/52-vmt-autoupgrade
          grep -q '"raspi-firmware\$";' /etc/apt/apt.conf.d/52-vmt-autoupgrade
          # no Raspberry Pi archive on this runner, so no Raspberry Pi origin
          test ! -e /etc/apt/apt.conf.d/53-vmt-raspberrypi-origin
          grep -q '^ignoreip = 127.0.0.1/8 ::1 127.0.0.1' /etc/fail2ban/jail.d/sshd.local
          sudo ufw status | grep -E '^22/tcp +ALLOW +127.0.0.1'
          ! sudo ufw status | grep -E '^22/tcp +ALLOW +Anywhere'

      - name: audit must still fail when a mandatory control is broken
        run: |
          set -a; . examples/raspberry-pi-kiosk.env; set +a
          sudo ufw disable
          if sudo -E make audit ADMIN_USER=ciadmin; then
            echo "::error::make audit passed with ufw disabled"
            exit 1
          fi
