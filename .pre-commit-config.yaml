# pre-commit hooks for vm-template.
# One-time local setup:  pip install pre-commit  &&  pre-commit install --install-hooks -t pre-commit -t commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: language-style
        name: language style (docs/STYLE.md)
        entry: scripts/lint-language.sh
        language: script
        types: [text]
        exclude: ^(docs/STYLE\.md|scripts/lint-language\.sh)$
      - id: language-style-commit-msg
        name: commit message style (docs/STYLE.md)
        entry: scripts/lint-language.sh --commit-msg
        language: script
        stages: [commit-msg]
